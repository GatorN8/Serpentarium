shell(`${header('THE ORIGINAL MORPH LAB','Patterns, pigments & genetics','Morph Lab remains part of Serpentarium: an optional learning station for ball python traits.',`<button class="btn" data-morphstart="1">Play 5 morphs ↗</button>`)}${intro}<div class="sectionbar"><h2>Foundational morph collection</h2></div><div class="four">${MORPHS.map(m=>`<article class="card">${photo(m)}<div class="atlas-info"><h3>${esc(m.name)}</h3><div class="tag cream">${esc(m.inherit)}</div><p class="bodycopy" style="font-size:12px;margin-top:9px">${esc(m.clue)}</p></div></article>`).join('')}</div><div class="sectionbar"><h2>Genetics without shortcuts</h2></div><div class="three"><div class="card pad"><div class="eyebrow">RECESSIVE</div><h3>Appearance vs. carrier</h3><p class="bodycopy">A recessive visual phenotype generally requires two copies at the relevant locus. A heterozygous carrier may look wild type.</p></div><div class="card pad"><div class="eyebrow">INCOMPLETE DOMINANCE</div><h3>Dosage can matter</h3><p class="bodycopy">Some variants show different appearances with one and two copies. Not all morph inheritance models work the same way.</p></div><div class="card pad"><div class="eyebrow">WELFARE FIRST</div><h3>Ethical breeding</h3><p class="bodycopy">Welfare-associated variants such as Spider should not be rewarded as breeding objectives. A full genetic simulator remains a later phase.</p></div></div>`)}
function morphStart(){ui.tab='morph';ui.morphQuiz={set:MORPHS.slice().sort((a,b)=>a.name.localeCompare(b.name)),index:0,correct:0,answer:null};render()}
function morphAnswer(id){let q=ui.morphQuiz;if(!q||q.answer!==null)return;let m=q.set[q.index];q.answer=id;if(id===m.id){q.correct++;if(!state.morphs.includes(m.id)){state.morphs.push(m.id);awardOnce('morph:'+m.id,10)}}save();render()}
function morphNext(){let q=ui.morphQuiz;if(!q||q.answer===null)return;if(q.index===q.set.length-1)q.finished=true;else {q.index++;q.answer=null}render()}
function sanctuary(){let available=HABITATS.filter(h=>state.habitats[h.id]),hab=HABITATS.find(h=>h.id===ui.habitat)||HABITATS[0],built=state.habitats[hab.id],canPlace=SPECIES.filter(s=>!s.venom&&state.researched.includes(s.id)&&hab.species.includes(s.id)&&!built?.exhibits.includes(s.id));let exhibits=(built?.exhibits||[]).map(find).filter(Boolean);let score=built?Math.min(100,50+(built.level-1)*17):0;shell(`${header('YOUR VIRTUAL WILDLIFE RESERVE','The Sanctuary','Turn research into carefully themed virtual habitats. No capturing, real animals, purchases, or countdown timers.',`<button class="btn secondary" data-nav="collection">View collection ↗</button>`)}<div class="statsgrid"><div class="card statbox"><strong>${available.length}</strong><small>HABITAT EXHIBITS</small></div><div class="card statbox"><strong>${available.reduce((n,h)=>n+(state.habitats[h.id]?.exhibits.length||0),0)}</strong><small>VIRTUAL SPECIES DISPLAYED</small></div><div class="card statbox"><strong>${state.points}</strong><small>RESEARCH POINTS</small></div><div class="card statbox"><strong>${state.researched.length}</strong><small>SPECIES STUDIED</small></div></div><div class="pillstrip" style="margin-bottom:17px">${HABITATS.map(h=>`<button class="pill ${ui.habitat===h.id?'active':''}" data-habitat="${h.id}">${h.icon} ${esc(h.name)} ${state.habitats[h.id]?'':'· '+h.price+' RP'}</button>`).join('')}</div><div class="exhibit-layout"><section class="card pad"><div class="row between wrap" style="margin-bottom:12px"><div><div class="eyebrow">HABITAT EXHIBIT</div><h2>${esc(hab.name)}</h2><p class="muted sm">${esc(hab.desc)}</p></div><span class="tag cream">${built?'Exhibit · Level '+built.level:'Not built'}</span></div><div class="habitat-scene ${hab.id}"><span class="place">${hab.icon} ${esc(hab.climate)}</span><div class="tree t1">${hab.id==='desert'?'🌵':'🌲'}</div><div class="tree t2">${hab.id==='desert'?'🪨':'🌳'}</div><div class="tree t3">${hab.id==='wetland'?'💧':'🌿'}</div><div class="inhabitants">${exhibits.map(s=>`<span>◇ ${esc(s.name)}</span>`).join('')||'<span>Discover species to populate this virtual exhibit</span>'}</div></div><p class="note" style="margin:12px 0 0">Habitat artwork is schematic illustration, not a real enclosure or animal photograph.</p></section><section class="card pad"><div class="eyebrow">SANCTUARY MANAGEMENT</div><h2>${built?'Habitat wellness':'Unlock this biome'}</h2>${built?`<div class="row between"><strong class="sm">Educational habitat score</strong><span class="tag">${score}%</span></div><div class="meter"><span style="width:${score}%"></span></div><p class="bodycopy">This is an illustrative game score—not a husbandry prescription. Improvements model richer environmental choice.</p><div class="habrow"><span>Exhibit resources</span><strong>Level ${built.level} / 4</strong></div><div class="habrow"><span>Species studied for this biome</span><strong>${hab.species.filter(id=>state.researched.includes(id)).length}/${hab.species.length}</strong></div><div class="habrow"><span>Exhibit display models</span><strong>${exhibits.length}</strong></div><div class="space"></div><button class="btn" data-upgrade="${hab.id}" ${built.level>=4||state.points<35*built.level?'disabled':''}>${built.level>=4?'Fully developed':`Improve exhibit · ${35*built.level} RP`}</button><div class="space"></div><div class="eyebrow" style="margin-top:17px">DESIGN ELEMENTS</div><div class="pillstrip">${hab.props.map(p=>`<span class="tag">${esc(p)}</span>`).join('')}</div>`:`<p class="bodycopy">Build a new learning exhibit to showcase appropriate virtual species. No wild animals are taken from nature.</p><p class="bodycopy">Cost: <strong>${hab.price} Research Points</strong></p><button class="btn" data-build="${hab.id}" ${state.points<hab.price?'disabled':''}>Build exhibit</button><p class="note" style="margin-top:16px">Earn points by studying new species and completing quizzes.</p>`}</section></div><div class="sectionbar"><h2>Virtual exhibit models</h2><small>${built?'Only researched species suited to this simplified game habitat':'Build this exhibit to add species'}</small></div>${!built?`<div class="empty">This habitat is locked. Study more species to earn Research Points.</div>`:hab.species.length===0?`<div class="empty">This environment is ready for a future species release. There are no eligible display models yet.</div>`:`<div class="three">${hab.species.map(id=>{let s=find(id),known=state.researched.includes(id),placed=built.exhibits.includes(id);return `<article class="card collection-card">${photo(s,'',false)}<h3>${esc(s.name)}</h3><p class="muted sm">${esc(s.latin)}</p><button class="btn ${known?'':'secondary'} tiny" ${placed?'disabled':''} data-add="${id}" data-at="${hab.id}">${placed?'✓ In exhibit':known?'Add virtual exhibit model':'Research species first'}</button></article>`}).join('')}</div>`}<div class="notice">For simplicity, some real habitat requirements are combined into game biomes. This is not an enclosure-planning tool. Venomous species are never placed in the collection or breeding activities.</div>`)}
function build(id){let h=HABITATS.find(x=>x.id===id);if(!h||state.habitats[id]||state.points<h.price)return;state.points-=h.price;state.habitats[id]={level:1,exhibits:[]};save();notify(h.name+' exhibit built');render()}
function upgrade(id){let b=state.habitats[id];if(!b||b.level>=4||state.points<35*b.level)return;state.points-=35*b.level;b.level++;save();notify('Habitat improved to level '+b.level);render()}
function addExhibit(id,at){let b=state.habitats[at],h=HABITATS.find(x=>x.id===at),s=find(id);if(!b||!h||!s||s.venom||!h.species.includes(id)||!state.researched.includes(id)||b.exhibits.includes(id))return;b.exhibits.push(id);save();notify(s.name+' added to virtual exhibit');render()}
function collection(){let saved=state.researched.map(find).filter(Boolean),favorites=state.favorites.map(find).filter(Boolean);shell(`${header('YOUR FIELD RECORD','My Collection','Every entry reflects an educational discovery. Build a knowledge archive, not a collection of wild-caught animals.')}<div class="statsgrid"><div class="card statbox"><strong>${saved.length}</strong><small>SPECIES DISCOVERED</small></div><div class="card statbox"><strong>${state.quizCorrect}</strong><small>CORRECT QUIZ ANSWERS</small></div><div class="card statbox"><strong>${state.daily.length}</strong><small>DAILY CHALLENGES</small></div><div class="card statbox"><strong>${state.morphs.length}</strong><small>MORPHS RECOGNIZED</small></div></div><div class="row between wrap"><h2>Discovered species</h2><button class="btn secondary" data-nav="atlas">Discover more →</button></div>${saved.length?`<div class="four">${saved.map(cardSpec).join('')}</div>`:`<div class="empty">Your field journal is open. Study a species in the atlas to add your first discovery and earn 20 RP.</div>`}<div class="sectionbar"><h2>Saved for later</h2><small>${favorites.length} bookmarked</small></div>${favorites.length?`<div class="four">${favorites.map(cardSpec).join('')}</div>`:`<div class="empty">Bookmark a specimen in the atlas and it will appear here.</div>`}<div class="sectionbar"><h2>Saved from the global explorer</h2><small>${(state.liveBookmarks||[]).length} online records</small></div>${(state.liveBookmarks||[]).length?`<div class="four">${state.liveBookmarks.map(t=>liveCard(t)).join('')}</div>`:`<div class="empty">Browse the live global atlas to bookmark species beyond the curated field guide. These saved records do not claim verified natural-history profiles.</div>`}<div class="sectionbar"><h2>Progress & backups</h2></div><div class="savepanel"><div class="card pad"><div class="eyebrow">DATA PROTECTION</div><h3>Keep your progress</h3><p class="bodycopy">Progress is saved in this browser when local storage is available. It will not automatically sync between your iPad and iPhone. Export a backup regularly.</p><div class="row wrap"><button class="btn" data-export="1">Download backup (.json)</button><button class="btn secondary" data-copybackup="1">Copy backup text</button></div></div><div class="card pad"><div class="eyebrow">RESTORE</div><h3>Import a backup</h3><p class="bodycopy">Restore a Serpentarium backup from this app. This replaces progress on the current device after confirmation.</p><label class="btn secondary" for="restoreFile" style="cursor:pointer">Choose backup file →</label><input type="file" id="restoreFile" accept=".json,application/json" style="position:absolute;left:-9999px"></div></div><div class="notice">This version does not yet import saved Morph Lab progress from Floot. Your original project remains unchanged; never delete it or clear its site data without exporting its existing backup.</div>`)}
function exportBackup(){let b=JSON.stringify({app:'Serpentarium',schema:1,exportedAt:new Date().toISOString(),saved:state},null,2);let url=URL.createObjectURL(new Blob([b],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='serpentarium-backup-'+dayKey()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('Backup file requested. Check your downloads or Files app.');}
async function copyBackup(){let b=JSON.stringify({app:'Serpentarium',schema:1,exportedAt:new Date().toISOString(),saved:state});try{await navigator.clipboard.writeText(b);notify('Backup text copied. Save it somewhere safe.')}catch(e){notify('Clipboard unavailable. Use Download backup instead.')}}
function validateBackup(input){if(!input||input.app!=='Serpentarium'||input.schema!==1||!input.saved||input.saved.version!==1)throw Error('Not a Serpentarium v1 backup');let s=input.saved;if(!Array.isArray(s.researched)||!Array.isArray(s.favorites)||!Array.isArray(s.claimed)||!Array.isArray(s.daily)||!Array.isArray(s.morphs)||!s.habitats||typeof s.habitats!=='object'||typeof s.points!=='number'||!Number.isFinite(s.points)||s.points<0||s.points>1e7||s.researched.length>2000||s.claimed.length>100000)throw Error('Backup data is invalid');let ids=new Set(SPECIES.map(s=>s.id));for(let id of [...s.researched,...s.favorites])if(!ids.has(id))throw Error('Unknown species in backup');for(let id of s.morphs)if(!MORPHS.some(m=>m.id===id))throw Error('Unknown morph in backup');for(let [id,h] of Object.entries(s.habitats)){let def=HABITATS.find(x=>x.id===id);if(!def||!h||!Number.isInteger(h.level)||h.level<1||h.level>4||!Array.isArray(h.exhibits)||h.exhibits.some(v=>!def.species.includes(v)||!ids.has(v)))throw Error('Invalid sanctuary state')}if(s.liveBookmarks!==undefined){if(!Array.isArray(s.liveBookmarks)||s.liveBookmarks.length>400||s.liveBookmarks.some(t=>!t||!Number.isInteger(t.id)||t.id<=0||typeof t.latin!=='string'||t.latin.length>160||typeof t.name!=='string'||t.name.length>180))throw Error('Invalid online bookmarks in backup')}return {...base(),...s,liveBookmarks:Array.isArray(s.liveBookmarks)?s.liveBookmarks:[]}}
async function importBackup(f){if(!f||f.size>5e6){notify('Backup missing or too large.');return}try{let p=JSON.parse(await f.text()),r=validateBackup(p);if(!confirm('Replace the Serpentarium progress saved on this device with this backup?'))return;state=r;save();notify('Backup restored');render()}catch(e){notify('Restore failed: '+e.message)}}
function render(){switch(ui.tab){case 'atlas':atlas();break;case 'venomous':atlas(true);break;case 'today':today();break;case 'seasons':seasons();break;case 'sanctuary':sanctuary();break;case 'collection':collection();break;case 'quiz':quiz();break;case 'morph':morphPage();break;default:today();}}
// All actions use event delegation to remain functional after every view rerender.
document.addEventListener('click',e=>{let el=e.target.closest('[data-nav],[data-detail],[data-back],[data-research],[data-favorite],[data-daily],[data-quizstart],[data-answer],[data-nextquiz],[data-month],[data-habitat],[data-build],[data-upgrade],[data-add],[data-morphstart],[data-morphanswer],[data-morphnext],[data-export],[data-copybackup]');if(!el)return; if(el.hasAttribute('data-nav')){let nav=el.dataset.nav;if(nav==='seasons'||nav==='morph'||nav==='quiz')go(nav);else go(nav)}else if(el.hasAttribute('data-detail')){ui.detail=el.dataset.detail;if(ui.tab==='today'||ui.tab==='collection'||ui.tab==='sanctuary')ui.tab='atlas';ui.atlasMode='field';render();window.scrollTo(0,0)}else if(el.hasAttribute('data-back')){ui.detail=null;render()}else if(el.hasAttribute('data-research'))research(el.dataset.research);else if(el.hasAttribute('data-favorite'))favorite(el.dataset.favorite);else if(el.hasAttribute('data-daily'))quizStart(true);else if(el.hasAttribute('data-quizstart'))quizStart(false);else if(el.hasAttribute('data-answer'))quizAnswer(el.dataset.answer);else if(el.hasAttribute('data-nextquiz'))quizNext();else if(el.hasAttribute('data-month')){ui.month=+el.dataset.month;render()}else if(el.hasAttribute('data-habitat')){ui.habitat=el.dataset.habitat;render()}else if(el.hasAttribute('data-build'))build(el.dataset.build);else if(el.hasAttribute('data-upgrade'))upgrade(el.dataset.upgrade);else if(el.hasAttribute('data-add'))addExhibit(el.dataset.add,el.dataset.at);else if(el.hasAttribute('data-morphstart'))morphStart();else if(el.hasAttribute('data-morphanswer'))morphAnswer(el.dataset.morphanswer);else if(el.hasAttribute('data-morphnext'))morphNext();else if(el.hasAttribute('data-export'))exportBackup();else if(el.hasAttribute('data-copybackup'))copyBackup();});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-detail][role="button"]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='atlasSearch'){ui.search=e.target.value;let start=e.target.selectionStart;atlas(ui.tab==='venomous');let el=$('#atlasSearch');if(el){el.focus();el.setSelectionRange(start,start)}}});
document.addEventListener('change',e=>{let id=e.target.id;if(id==='regionFilter'){ui.region=e.target.value;render()}else if(id==='familyFilter'){ui.family=e.target.value;render()}else if(id==='venomFilter'){ui.venom=e.target.value;render()}else if(id==='seasonRegion'){ui.seasonRegion=e.target.value;state.prefs.region=ui.seasonRegion;save();render()}else if(id==='restoreFile'){importBackup(e.target.files[0]);e.target.value=''}});

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-atlasmode],[data-live-reset],[data-live-retry],[data-live-prev],[data-live-next],[data-livedetail],[data-live-save],[data-live-back]');if(!el)return;
 if(el.hasAttribute('data-atlasmode')){ui.atlasMode=el.dataset.atlasmode==='live'?'live':'field';ui.detail=null;ui.liveDetail=null;ui.tab='atlas';render();if(ui.atlasMode==='live'&&!live.received)loadLive();window.scrollTo(0,0)}
 else if(el.hasAttribute('data-live-reset')){live.query='';live.page=1;ui.liveDetail=null;loadLive()}
 else if(el.hasAttribute('data-live-retry'))loadLive(true);
 else if(el.hasAttribute('data-live-prev')){live.page=Math.max(1,live.page-1);loadLive();window.scrollTo(0,0)}
 else if(el.hasAttribute('data-live-next')){live.page++;loadLive();window.scrollTo(0,0)}
 else if(el.hasAttribute('data-livedetail')){ui.atlasMode='live';ui.tab='atlas';ui.liveDetail=Number(el.dataset.livedetail);render();window.scrollTo(0,0)}
 else if(el.hasAttribute('data-live-back')){ui.liveDetail=null;render()}
 else if(el.hasAttribute('data-live-save'))toggleLiveBookmark(Number(el.dataset.liveSave));
});
document.addEventListener('submit',e=>{if(e.target?.id!=='liveSearchForm')return;e.preventDefault();const input=e.target.querySelector('#liveSearch');if(!input)return;live.query=input.value.trim().slice(0,90);live.page=1;ui.liveDetail=null;loadLive()});

render();
</script>
</body>
</html>
